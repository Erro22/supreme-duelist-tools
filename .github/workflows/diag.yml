name: diag
on:
  push:
    paths: ['diag-trigger.txt']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          K: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          {
            echo "ts=$(date -u +%H:%M:%S)"
            echo "len=${#K}"
            mkdir -p ~/.ssh
            if [[ "$K" == -----BEGIN* ]]; then
              printf '%s\n' "$K" > ~/.ssh/k
            else
              printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$K" > ~/.ssh/k
            fi
            chmod 600 ~/.ssh/k
            ssh-keygen -y -f ~/.ssh/k > /dev/null 2>&1 && echo "key_parse=OK" || echo "key_parse=FAIL"
            ssh -i ~/.ssh/k -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -T git@github.com 2>&1 | head -2
          } > diag-result.txt 2>&1
          git config user.name diag && git config user.email diag@local
          git add diag-result.txt
          git commit -m "diag [skip ci]" || true
          git push || true
