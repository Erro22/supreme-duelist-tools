name: diag
on:
  push:
    paths: ['diag-trigger.txt']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          K: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          {
            echo "ts=$(date -u +%H:%M:%S)"
            echo "len=${#K}"
            echo "head10=${K:0:10}"
            case "$K" in
              *"BEGIN OPENSSH PRIVATE KEY"*) echo "kind=OPENSSH";;
              *) echo "kind=OTHER";;
            esac
            mkdir -p ~/.ssh && printf '%s\n' "$K" > ~/.ssh/k && chmod 600 ~/.ssh/k
            ssh -i ~/.ssh/k -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -T git@github.com 2>&1 | head -2
          } > diag-result.txt 2>&1
          git config user.name diag && git config user.email diag@local
          git add diag-result.txt
          git commit -m "diag [skip ci]" || true
          git push || true
