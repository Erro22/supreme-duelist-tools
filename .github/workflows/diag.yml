name: diag
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: secret shape
        env:
          K: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          echo "len=${#K}"
          case "$K" in
            "") echo "EMPTY";;
            *"BEGIN OPENSSH PRIVATE KEY"*) echo "PRIVATE_OPENSSH";;
            *"BEGIN RSA PRIVATE KEY"*) echo "PRIVATE_RSA";;
            "ssh-ed25519"*) echo "PUBLIC_KEY";;
            *) echo "OTHER";;
          esac
          mkdir -p ~/.ssh && printf '%s\n' "$K" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -T git@github.com 2>&1 | head -3
